# Конфігурація Nginx для Geo7
server {
    listen 80;
    server_name _;

    # Кореневий каталог додатку
    root /var/www/html;
    index index.html index.php;

    # Charset для підтримки кирилиці
    charset utf-8;

    # Логи
    access_log /var/log/nginx/geo7_access.log;
    error_log  /var/log/nginx/geo7_error.log;

    # Основний роут — SPA (index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Маршрутизація PHP-запитів через PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # Кешування статичних ресурсів
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Забороняємо доступ до прихованих файлів (.env тощо)
    location ~ /\. {
        deny all;
    }
}
